<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScriptVault Roblox</title><link rel="stylesheet" href="/style.css"></head><body><div class="bg"></div><div id="toast"></div><main><header><a class="brand" href="/">SV<span>•</span></a><div id="userArea"></div></header><section id="auth" class="auth"><div class="orb">✦</div><p class="eyebrow">ROBLOX SCRIPT HOSTING</p><h1>ScriptVault<span> Pro</span></h1><p class="sub">Héberge tes scripts et génère des loaders en un clic.</p><div class="tabs"><button class="tab active" data-mode="login">Connexion</button><button class="tab" data-mode="register">Créer un compte</button></div><input id="username" placeholder="Pseudo"><input id="password" type="password" placeholder="Mot de passe"><button id="authBtn" class="primary">Se connecter</button><p id="authErr" class="err"></p></section><section id="dash" class="hidden"><div class="dashHead"><div><p class="eyebrow">CONTROL CENTER</p><h2>Dashboard</h2></div><button id="newBtn" class="primary">+ Nouveau script</button></div><div class="stats"><div><b id="count">0</b><small>Scripts</small></div><div><b id="loads">0</b><small>Chargements</small></div></div><div id="scripts" class="grid"></div></section><section id="modal" class="modal hidden"><div class="modalbox"><button class="close" id="close">×</button><p class="eyebrow">NEW SCRIPT</p><h2>Créer un script</h2><input id="sname" placeholder="Nom du script"><textarea id="code" placeholder="Colle ton code Lua ici..."></textarea><input id="spw" type="password" placeholder="Mot de passe raw (optionnel)"><button id="save" class="primary">Créer et générer le loader</button><p id="modalErr" class="err"></p></div></section></main><script src="/app.js"></script></body></html>
